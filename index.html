<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be My Valentine ❤️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(-45deg,#ff9a9e,#fad0c4,#fad0c4,#ffdde1);
  background-size: 400% 400%;
  animation: gradient 12s ease infinite;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

@keyframes gradient {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card {
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.7);
  padding: 40px;
  border-radius: 25px;
  text-align: center;
  max-width: 900px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h1 {
  font-size: 2em;
  margin-bottom: 25px;
}

button {
  padding: 12px 30px;
  margin: 12px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.3s;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: #ddd;
  position: absolute;
}

.gallery {
  margin-top: 35px;
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
  gap: 18px;
}

.photo {
  height: 130px;
  border-radius: 20px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #888;
  box-shadow: 0 8px 18px rgba(0,0,0,0.15);
  transition: 0.3s;
}

.photo:hover {
  transform: scale(1.08) rotate(-1deg);
}

.heart {
  position: fixed;
  font-size: 18px;
  animation: float 6s linear infinite;
  opacity: .6;
}

@keyframes float {
  from {transform: translateY(100vh) scale(.5);}
  to {transform: translateY(-10vh) scale(1.2);}
}
</style>
</head>

<body>

<!-- Background Music -->
<iframe width="0" height="0"
 src="music.mp3"
 frameborder="0" allow="autoplay"></iframe>

<div class="card">
  <h1>Will you be my Valentine? 💖</h1>

  <button id="yes" onclick="celebrate()">Yes ❤️</button>
  <button id="no">No</button>

  <div class="gallery">
    <div class="photo">Photo 1</div>
    <div class="photo">Photo 2</div>
    <div class="photo">Photo 3</div>
    <div class="photo">Photo 4</div>
    <div class="photo">Photo 5</div>
    <div class="photo">Photo 6</div>
    <div class="photo">Photo 7</div>
    <div class="photo">Photo 8</div>
    <div class="photo">Photo 9</div>
    <div class="photo">Photo 10</div>
  </div>
</div>

<script>
const noBtn = document.getElementById('no');

function moveButton(){
  const x=Math.random()*(window.innerWidth-100);
  const y=Math.random()*(window.innerHeight-50);
  noBtn.style.left=x+'px';
  noBtn.style.top=y+'px';
}

noBtn.addEventListener('mouseenter',moveButton);
noBtn.addEventListener('click',moveButton);

function celebrate(){
  alert("Yay!! ❤️ Can't wait for our Valentine date!");
  for(let i=0;i<25;i++){
    const heart=document.createElement('div');
    heart.innerHTML='❤️';
    heart.className='heart';
    heart.style.left=Math.random()*45+'vw';
    heart.style.animationDuration=(Math.random()*3+3)+'s';
    document.body.appendChild(heart);
  }
}
</script>

</body>
</html>
